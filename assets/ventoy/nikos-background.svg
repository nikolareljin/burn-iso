<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="blue-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#2e3440"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="4" fill="#2196f3" opacity=".8"/>

  <!-- Compact top-centre NikOS header, matching the IsoForge theme layout. -->
  <g transform="translate(960 165)">
    <g fill="none" stroke-linecap="round">
      <line x1="-116" y1="-22" x2="-42" y2="-66" stroke="#2196f3" stroke-width="4"/>
      <line x1="42" y1="-66" x2="116" y2="-22" stroke="#90a4ae" stroke-width="3" opacity=".85"/>
      <line x1="-116" y1="48" x2="-34" y2="70" stroke="#2196f3" stroke-width="4"/>
      <line x1="34" y1="70" x2="116" y2="48" stroke="#90a4ae" stroke-width="3" opacity=".85"/>
    </g>
    <circle cx="0" cy="-78" r="16" fill="#2196f3" filter="url(#blue-glow)"/>
    <circle cx="-132" cy="-16" r="18" fill="#2196f3"/>
    <circle cx="132" cy="-16" r="13" fill="#90a4ae"/>
    <rect x="-150" y="34" width="30" height="30" rx="8" fill="#2196f3"/>
    <circle cx="0" cy="79" r="17" fill="#2196f3" filter="url(#blue-glow)"/>
    <circle cx="132" cy="48" r="13" fill="#90a4ae"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="#eceff4">NikOS</text>
  </g>
  <text x="960" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="5" fill="#81a1c1">NEURAL INNOVATION FOR KNOWLEDGE OS</text>
  <text x="960" y="329" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="4" fill="#4c566a">LIGHT SYSTEM. HEAVY THINKING.</text>
  <text x="960" y="1010" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#4c566a">VENTOY BOOT SYSTEM</text>
</svg>
