# NikOS as an installable image.
#
# NikOS is normally applied to a machine that is already running: its installer
# clones the playbook and runs it against the live desktop. This recipe runs the
# same playbook inside the image instead, so the result is an ISO that installs
# an already-provisioned system.
#
#   sudo ./forge --recipe recipes/nikos.yml
#
recipe: nikos-desktop

base:
  catalog_id: Xubuntu_24_04_4_desktop_amd64

output:
  name: nikos-24.04-amd64
  volume_id: NIKOS_2404
  label: NikOS 24.04

packages:
  install:
    - git
    - curl
    - ca-certificates

ansible:
  repo: https://github.com/nikolareljin/nikos
  ref: "0.6.1"
  playbook: site.yml
  inventory: inventory/local
  # site.yml takes nikos_home and nikos_user from the controller's environment,
  # which in a chroot is root. Pointing the per-user half at /etc/skel means
  # every account the installer creates inherits the NikOS desktop.
  skel_home: /etc/skel
  # These need a running session or a machine that has already booted, so they
  # belong on first login rather than at build time.
  skip_tags:
    - github-setup
  extra_vars:
    nikos_desktop_flavor: xubuntu-minimal
