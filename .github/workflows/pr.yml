name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gate:
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      build_command: "./tools/gen-man.sh && git diff --exit-code docs/man/isoforge.1 && bash -n inc/isoforge.sh inc/burn.sh inc/download.sh inc/setup.sh inc/forge.sh inc/forge/*.sh"
      # The image tests build and repack a synthetic ISO, so the runner needs
      # xorriso and squashfs-tools. Without them those tests skip rather than
      # fail, which would hide a real regression.
      test_command: "sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xorriso squashfs-tools && ./scripts/test-forge-recipe.sh && ./scripts/test-forge-distrodeck.sh && ./scripts/test-forge-image.sh"
